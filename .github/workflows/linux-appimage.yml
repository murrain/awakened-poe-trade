name: Linux AppImage

on:
  workflow_dispatch:
  push:
    branches:
      - master
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: linux-sync-build
  cancel-in-progress: false

env:
  UPSTREAM_REPO: SnosMe/awakened-poe-trade
  UPSTREAM_BRANCH: master
  # Keep these fork-owned files when syncing upstream into master.
  # They intentionally diverge from upstream and would otherwise block sync.
  SYNC_OWNED_FILES: >-
    .github/workflows/linux-appimage.yml
    .github/workflows/linux-appimage-build.yml
    .github/workflows/main.yml
    main/electron-builder.yml
  # These files get rewritten by the Linux build workflow on every run
  # (npm version, npm pkg set, npm install --package-lock-only).
  # Any merge conflict in them is resolved by taking the upstream version so
  # we pick up new dependencies / postinstall hooks automatically.
  SYNC_UPSTREAM_WINS_FILES: >-
    main/package.json
    main/package-lock.json

jobs:
  sync-master:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      should_build: ${{ steps.sync.outputs.should_build }}
    steps:
      - name: Checkout fork master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream master
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git
          git fetch origin master
          git fetch upstream ${{ env.UPSTREAM_BRANCH }}

      - name: Sync fork master to upstream
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git checkout master
          UPSTREAM_SHA=$(git rev-parse "upstream/${UPSTREAM_BRANCH}")

          SHOULD_BUILD=false
          PUSHED_UPDATE=false

          if ! git merge-base --is-ancestor "$UPSTREAM_SHA" origin/master; then
            git merge --no-commit --no-ff "$UPSTREAM_SHA" || true

            # Keep fork-owned workflow and Linux packaging metadata on master.
            # Only check out paths that exist on the fork side so a file
            # deleted on fork but still present upstream does not abort the
            # resolution.
            for path in ${{ env.SYNC_OWNED_FILES }}; do
              if git cat-file -e "origin/master:$path" 2>/dev/null; then
                git checkout origin/master -- "$path"
                git add -- "$path"
              fi
            done

            # Take upstream's version for files the build workflow rewrites
            # anyway. This lets upstream introduce new devDependencies or
            # postinstall hooks without blocking the scheduled sync.
            for path in ${{ env.SYNC_UPSTREAM_WINS_FILES }}; do
              if git cat-file -e "$UPSTREAM_SHA:$path" 2>/dev/null; then
                git checkout "$UPSTREAM_SHA" -- "$path"
                git add -- "$path"
              fi
            done

            UNRESOLVED=$(git diff --name-only --diff-filter=U)
            if [ -n "$UNRESOLVED" ]; then
              # A genuine conflict outside the auto-resolvable file lists.
              # Instead of failing the scheduled job, open (or reuse) a PR that
              # carries the partially-resolved merge so a human can finish it,
              # then keep this run green.
              echo "Unresolved upstream sync conflicts remain:"
              echo "$UNRESOLVED"

              SHORT_SHA=$(git rev-parse --short "$UPSTREAM_SHA")
              SYNC_BRANCH="automated/upstream-sync-${SHORT_SHA}"

              if git ls-remote --exit-code --heads origin "$SYNC_BRANCH" >/dev/null 2>&1; then
                echo "Sync branch $SYNC_BRANCH already exists; leaving its PR for manual resolution."
                git merge --abort || true
              else
                # Commit the merge WITH conflict markers still in the tree so the
                # PR shows exactly what needs resolving. `git add -A` stages the
                # conflicted files as-is; committing mid-merge records both
                # parents (master + upstream).
                git add -A
                git commit --no-edit -m "Automated upstream sync (needs manual conflict resolution)" \
                  -m "The scheduled sync could not auto-resolve conflicts in:" \
                  -m "$UNRESOLVED" \
                  -m "Resolve the remaining <<<<<<< conflict markers on this branch, then merge to master."
                git push origin "HEAD:${SYNC_BRANCH}"

                gh pr create \
                  --base master \
                  --head "$SYNC_BRANCH" \
                  --title "Upstream sync needs manual conflict resolution (${SHORT_SHA})" \
                  --body "$(printf 'The scheduled **sync-master** job hit conflicts it could not auto-resolve while merging `%s@%s` into `master`.\n\n**Conflicted files:**\n```\n%s\n```\n\nThis branch contains the merge with those conflicts left as `<<<<<<<` markers (everything else, including the owned-file and upstream-wins resolutions, is already applied). Resolve the markers on this branch and merge to `master`.' "$UPSTREAM_REPO" "$SHORT_SHA" "$UNRESOLVED")" \
                  || echo "PR creation skipped (it may already exist)."
              fi

              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # If every change came from fork-owned or upstream-wins resolution
            # there may be nothing new to commit.
            if git diff --cached --quiet; then
              echo "Upstream sync produced no net changes; skipping commit."
              git merge --abort || true
            else
              git commit --no-edit
              git push origin HEAD:master
              PUSHED_UPDATE=true
            fi
          fi

          # Manual dispatch should build the current master only when the sync
          # step did not already push a fresh master commit that will trigger a
          # separate push-based release run.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$PUSHED_UPDATE" = false ]; then
            SHOULD_BUILD=true
          fi

          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"

  build-from-dispatch:
    needs: sync-master
    if: github.event_name == 'workflow_dispatch' && needs.sync-master.outputs.should_build == 'true'
    uses: ./.github/workflows/linux-appimage-build.yml
    secrets: inherit
    with:
      checkout_ref: master

  build-from-push:
    if: github.event_name == 'push'
    uses: ./.github/workflows/linux-appimage-build.yml
    secrets: inherit
    with:
      checkout_ref: master
